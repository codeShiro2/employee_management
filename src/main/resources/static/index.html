
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #e9edf3;
        }

        tr:nth-child(even) {
            background: #f9fafc;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management</h1>

    <!-- Employee Form (Create) -->
    <div class="card">
        <h2>Add Employee</h2>

        <form action="/employees" method="post">

            <label for="employeeId">Employee ID</label>
            <input type="text" id="employeeId"
                   name="employeeId" required>

            <label for="employeeName">Employee Name</label>
            <input type="text" id="employeeName"
                   name="employeeName" required>

            <label for="employeeEmail">Employee Email</label>
            <input type="email" id="employeeEmail"
                   name="employeeEmail" required>

            <label for="location">Location</label>
            <input type="text" id="location"
                   name="location" required>

            <button type="submit">Save Employee</button>

        </form>
    </div>

    <!-- Update -->
    <div class="card">
        <h2>Update Employee</h2>

        <form action="/employees/update" method="post">

            <input type="hidden" name="_method" value="PUT">

            <input type="text" name="employeeId"
                   placeholder="Employee ID" required>

            <input type="text" name="employeeName"
                   placeholder="New Name" required>

            <input type="email" name="employeeEmail"
                   placeholder="New Email" required>

            <input type="text" name="location"
                   placeholder="New Location" required>

            <button type="submit">Update</button>

        </form>
    </div>

    <!-- All Employees -->
    <div class="card">
        <h2>All Employees</h2>

        <table>
            <thead>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Location</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="employee : ${employees}">

                <td th:text="${employee.employeeId}"></td>
                <td th:text="${employee.employeeName}"></td>
                <td th:text="${employee.employeeEmail}"></td>
                <td th:text="${employee.location}"></td>

                <td>
                    <form th:action="@{/employees/delete/{employeeId}(employeeId=${employee.employeeId})}"
                          th:method="delete">

                        <button type="submit" class="delete-btn">
                            Delete
                        </button>

                    </form>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" style="text-align:center;">
                    No employees found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
